<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张会来 | 个人主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .avatar-section { text-align: center; margin-bottom: 40px; }

        .avatar {
            width: 150px; height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 56px; font-weight: 700;
            margin: 0 auto 20px;
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.4);
            animation: pulse 3s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s;
            user-select: none;
        }

        .avatar:hover { transform: scale(1.1) rotate(5deg); }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 40px rgba(102, 126, 234, 0.4); }
            50% { box-shadow: 0 0 80px rgba(102, 126, 234, 0.8); }
        }

        .name {
            font-size: 48px; font-weight: 700;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #667eea);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 4s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle { font-size: 18px; color: #888; margin-top: 10px; letter-spacing: 2px; }

        .info-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-icon { font-size: 30px; margin-bottom: 15px; color: #a8b5ff; }
        .card-title { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .card-value { font-size: 20px; font-weight: 600; }

        .typewriter { text-align: center; margin: 50px 0 20px; font-size: 22px; color: #ccc; min-height: 35px; }
        .typewriter .cursor { animation: blink 1s infinite; }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .skills-section { margin: 50px 0; }
        .skills-section h2 { font-size: 28px; margin-bottom: 30px; text-align: center; }
        .skill-item { margin-bottom: 20px; }
        .skill-header { display: flex; justify-content: space-between; margin-bottom: 8px; }

        .skill-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .skill-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0;
            transition: width 2s ease;
        }

        .fun-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 50px 0;
            text-align: center;
        }

        .stat-item { padding: 20px; }

        .stat-number {
            font-size: 42px; font-weight: 700;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label { font-size: 13px; color: #888; margin-top: 5px; }

        .music-bars {
            display: flex; align-items: flex-end; justify-content: center;
            gap: 4px; height: 40px; margin: 30px 0;
        }

        .bar {
            width: 6px; height: 8px;
            background: linear-gradient(to top, #667eea, #764ba2);
            border-radius: 3px;
            animation: musicBar 1.2s ease-in-out infinite;
        }

        .bar:nth-child(1) { animation-delay: 0s; }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }
        .bar:nth-child(6) { animation-delay: 0.5s; }
        .bar:nth-child(7) { animation-delay: 0.6s; }
        .bar:nth-child(8) { animation-delay: 0.7s; }

        @keyframes musicBar {
            0%, 100% { height: 8px; }
            50% { height: 35px; }
        }

        .footer { text-align: center; padding: 40px 0; color: #555; font-size: 14px; }
        .footer a { color: #667eea; text-decoration: none; }

        .cursor-glow {
            position: fixed;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.15), transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .easter-egg {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #667eea;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            z-index: 100;
            animation: popIn 0.3s ease;
        }

        .easter-egg.show { display: block; }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0); }
            to { transform: translate(-50%, -50%) scale(1); }
        }

        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #888; }
        .close-btn:hover { color: #fff; }

        @media (max-width: 600px) {
            .name { font-size: 36px; }
            .container { padding: 40px 15px; }
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="cursor-glow" id="cursorGlow"></div>

    <div class="container">
        <div class="avatar-section">
            <div class="avatar" id="avatar" title="点我有惊喜">张</div>
            <h1 class="name">张会来</h1>
            <p class="subtitle">探索者 · 创造者 · 梦想家</p>
        </div>

        <div class="typewriter">
            <span id="typewriter-text"></span><span class="cursor">|</span>
        </div>

        <div class="music-bars">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <div class="info-cards">
            <div class="card">
                <div class="card-icon">&#10022;</div>
                <div class="card-title">出生日期</div>
                <div class="card-value">1998年08月24日</div>
            </div>
            <div class="card">
                <div class="card-icon">&#9794;</div>
                <div class="card-title">性别</div>
                <div class="card-value">男</div>
            </div>
            <div class="card">
                <div class="card-icon">&#9805;</div>
                <div class="card-title">星座</div>
                <div class="card-value">处女座</div>
            </div>
            <div class="card">
                <div class="card-icon">&#9203;</div>
                <div class="card-title">距离下次生日</div>
                <div class="card-value" id="birthday-countdown">计算中...</div>
            </div>
        </div>

        <div class="fun-stats">
            <div class="stat-item">
                <div class="stat-number" id="stat-days" data-target="0">0</div>
                <div class="stat-label">已存活天数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="stat-hours" data-target="0">0</div>
                <div class="stat-label">已存活小时</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" data-target="99">0</div>
                <div class="stat-label">魅力值</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" data-target="42">0</div>
                <div class="stat-label">宇宙终极答案</div>
            </div>
        </div>

        <div class="skills-section">
            <h2>&#10024; 技能树</h2>
            <div class="skill-item">
                <div class="skill-header"><span>&#128187; 编程能力</span><span>85%</span></div>
                <div class="skill-bar"><div class="skill-fill" data-width="85%"></div></div>
            </div>
            <div class="skill-item">
                <div class="skill-header"><span>&#127912; 创意设计</span><span>75%</span></div>
                <div class="skill-bar"><div class="skill-fill" data-width="75%"></div></div>
            </div>
            <div class="skill-item">
                <div class="skill-header"><span>&#127834; 干饭能力</span><span>98%</span></div>
                <div class="skill-bar"><div class="skill-fill" data-width="98%"></div></div>
            </div>
            <div class="skill-item">
                <div class="skill-header"><span>&#128031; 摸鱼技巧</span><span>92%</span></div>
                <div class="skill-bar"><div class="skill-fill" data-width="92%"></div></div>
            </div>
            <div class="skill-item">
                <div class="skill-header"><span>&#127769; 熬夜指数</span><span>88%</span></div>
                <div class="skill-bar"><div class="skill-fill" data-width="88%"></div></div>
            </div>
        </div>

        <div class="footer">
            <p>&#10024; 用代码编织梦想，用热爱点亮生活 &#10024;</p>
            <p style="margin-top: 10px;">&copy; <span id="year"></span> 张会来 | 按 <kbd style="background:#333;padding:2px 8px;border-radius:4px;">K</kbd> 键有彩蛋，连点 5 次头像也有惊喜</p>
        </div>
    </div>

    <div class="easter-egg" id="easterEgg">
        <span class="close-btn" id="closeEgg">&times;</span>
        <div style="font-size: 52px; margin-bottom: 20px;">&#127881;</div>
        <h2 style="margin-bottom: 15px;">你发现了隐藏彩蛋！</h2>
        <p style="color: #aaa; line-height: 1.8;">
            恭喜你，好奇心满满的你！<br>
            张会来同学祝你今天开心，万事顺意！<br>
            <span style="font-size: 12px; color: #666;">（处女座的人果然细心）</span>
        </p>
    </div>

    <script>
        // 粒子背景
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                size: Math.random() * 2 + 0.5,
                opacity: Math.random() * 0.5 + 0.2
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(102, 126, 234, ' + p.opacity + ')';
                ctx.fill();

                particles.forEach((p2, j) => {
                    if (i === j) return;
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = 'rgba(102, 126, 234, ' + (0.1 * (1 - dist / 120)) + ')';
                        ctx.stroke();
                    }
                });
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 鼠标跟随光效
        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('cursorGlow');
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // 打字机效果
        const phrases = [
            '你好，我是张会来',
            '一个热爱生活的处女座男生',
            '永远保持好奇心',
            '代码改变世界',
            '今天也要元气满满'
        ];
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typewriterEl = document.getElementById('typewriter-text');

        function typeWriter() {
            const current = phrases[phraseIndex];
            if (!isDeleting) {
                typewriterEl.textContent = current.substring(0, charIndex + 1);
                charIndex++;
                if (charIndex === current.length) {
                    setTimeout(() => { isDeleting = true; typeWriter(); }, 2000);
                    return;
                }
                setTimeout(typeWriter, 120);
            } else {
                typewriterEl.textContent = current.substring(0, charIndex - 1);
                charIndex--;
                if (charIndex === 0) {
                    isDeleting = false;
                    phraseIndex = (phraseIndex + 1) % phrases.length;
                    setTimeout(typeWriter, 400);
                    return;
                }
                setTimeout(typeWriter, 60);
            }
        }
        typeWriter();

        // 根据生日实时计算存活天数与小时
        const birthday = new Date('1998-08-24T00:00:00');
        const daysLived = Math.floor((Date.now() - birthday.getTime()) / 86400000);
        document.getElementById('stat-days').dataset.target = daysLived;
        document.getElementById('stat-hours').dataset.target = daysLived * 24 + new Date().getHours();

        // 下次生日倒计时
        function birthdayCountdown() {
            const now = new Date();
            let next = new Date(now.getFullYear(), 7, 24);
            if (now > next) next = new Date(now.getFullYear() + 1, 7, 24);
            const diff = Math.ceil((next - now) / 86400000);
            document.getElementById('birthday-countdown').textContent = diff + ' 天';
        }
        birthdayCountdown();

        // 数字滚动动画
        function animateCounters() {
            document.querySelectorAll('.stat-number').forEach(el => {
                const target = parseInt(el.dataset.target, 10);
                const duration = 2000;
                const start = performance.now();
                function step(now) {
                    const progress = Math.min((now - start) / duration, 1);
                    el.textContent = Math.floor(progress * target).toLocaleString();
                    if (progress < 1) requestAnimationFrame(step);
                }
                requestAnimationFrame(step);
            });
        }

        // 技能条动画
        function animateSkills() {
            document.querySelectorAll('.skill-fill').forEach(el => {
                el.style.width = el.dataset.width;
            });
        }

        // 滚动到可视区域时触发
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    if (entry.target.classList.contains('fun-stats')) animateCounters();
                    if (entry.target.classList.contains('skills-section')) animateSkills();
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.3 });
        observer.observe(document.querySelector('.fun-stats'));
        observer.observe(document.querySelector('.skills-section'));

        // 彩蛋：按 K 键触发
        document.addEventListener('keydown', (e) => {
            if (e.key === 'k' || e.key === 'K') {
                document.getElementById('easterEgg').classList.add('show');
            }
        });
        document.getElementById('closeEgg').addEventListener('click', () => {
            document.getElementById('easterEgg').classList.remove('show');
        });

        // 头像点击：撒彩带，连点 5 次触发彩蛋
        let clickCount = 0;
        document.getElementById('avatar').addEventListener('click', () => {
            clickCount++;
            spawnConfetti();
            if (clickCount === 5) {
                document.getElementById('easterEgg').classList.add('show');
                clickCount = 0;
            }
        });

        function spawnConfetti() {
            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#ffd700'];
            const rect = document.getElementById('avatar').getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            for (let i = 0; i < 30; i++) {
                const c = document.createElement('div');
                c.style.cssText = 'position:fixed;width:8px;height:8px;border-radius:2px;z-index:99;pointer-events:none;';
                c.style.left = cx + 'px';
                c.style.top = cy + 'px';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(c);
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 300 + 100;
                const dx = Math.cos(angle) * speed;
                const dy = Math.sin(angle) * speed - 200;
                c.animate([
                    { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
                    { transform: 'translate(' + dx + 'px, ' + (dy + 400) + 'px) rotate(' + (Math.random() * 720) + 'deg)', opacity: 0 }
                ], { duration: 1200 + Math.random() * 600, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)' }).onfinish = () => c.remove();
            }
        }

        // 页脚年份
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
